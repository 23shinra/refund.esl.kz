services:
  mysql:
    image: mysql:8.4
    container_name: qoldau-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: qoldau
      MYSQL_USER: qoldau
      MYSQL_PASSWORD: qoldau_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - qoldau_mysql_data:/var/lib/mysql

volumes:
  qoldau_mysql_data:

